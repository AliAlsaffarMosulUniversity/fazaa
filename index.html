<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2b705">
<link rel="manifest" href="manifest.json">

<title>فزعة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Lalezar&display=swap">
<style>
:root{
  --bg:#f1f2ee; --surface:#ffffff; --ink:#141a20; --muted:#56606a; --line:#dcdfd8;
  --chip:#e8eae4; --accent:#f2b705; --accent-ink:#1b1500; --good:#1d7444; --warn:#9a5600; --bad:#b3261e;
  --stripe:#141a20; --bar2:#c9cdc4; --shadow:0 1px 2px rgba(20,26,32,.06),0 6px 18px rgba(20,26,32,.06);
  --f-display:"Lalezar","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1317; --surface:#192027; --ink:#edf0f2; --muted:#a0a9b2; --line:#2a333c;
  --chip:#222a32; --accent:#f5c518; --accent-ink:#1b1500; --good:#52c78a; --warn:#f2a640; --bad:#ff8a80;
  --stripe:#0f1317; --bar2:#3a444e; --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1317; --surface:#192027; --ink:#edf0f2; --muted:#a0a9b2; --line:#2a333c;
  --chip:#222a32; --accent:#f5c518; --accent-ink:#1b1500; --good:#52c78a; --warn:#f2a640; --bad:#ff8a80;
  --stripe:#0f1317; --bar2:#3a444e; --shadow:none; color-scheme:dark }
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;gap:10px;padding-block:12px 10px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);flex:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2;margin-top:2px}
.dayp{font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.dayp.free{color:var(--good)}
.roles{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.roles button{border:0;background:transparent;border-radius:9px;min-height:40px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.roles button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
main{display:flex;flex-direction:column;gap:20px;padding-top:4px}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0}
p{margin:0}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:20px 18px 22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:8px;background:repeating-linear-gradient(135deg,var(--stripe) 0 12px,transparent 12px 24px);opacity:.85}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:500;min-height:84px;text-align:center}
.cat:hover{border-color:var(--accent)}
.cat .ic{width:36px;height:36px;border-radius:10px;background:var(--chip);display:grid;place-items:center}
.cat small{color:var(--muted);font-size:11px}
.list{display:flex;flex-direction:column;gap:10px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap}
.badge.ok{color:var(--good)}
.badge.warn{color:var(--warn)}
.badge.bad{color:var(--bad)}
.badge.gold{background:var(--accent);color:var(--accent-ink)}
.btn{border:0;border-radius:12px;min-height:46px;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sec2{background:var(--chip);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.wa{background:#1f8f4e;color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:13.5px;border-radius:10px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2>.btn{flex:1 1 120px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font-weight:500;min-height:44px;padding:0;align-self:flex-start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hl{border:2px solid var(--accent)}
.card.alert{border:2px solid var(--bad)}
.card.inner{background:var(--bg);padding:12px;gap:8px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-weight:500;font-size:13.5px}
.field input,.field textarea,.field select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
.field textarea{min-height:92px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;min-height:40px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sumrow{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-variant-numeric:tabular-nums}
.sumrow.total{font-weight:700;font-size:16px;border-top:1px dashed var(--line);padding-top:10px}
.strike{text-decoration:line-through;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:28px 1fr;gap:10px;min-height:46px;position:relative}
.timeline li::before{content:"";position:absolute;right:13px;top:26px;bottom:-2px;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;z-index:1}
.timeline li.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.timeline li.done::before{background:var(--good)}
.timeline li.now .dot{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.tl-t{font-weight:500;padding-top:3px}
.tl-s{font-size:12.5px;color:var(--muted)}
.offer{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.offer.best{border:2px solid var(--good)}
.offer .top{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.av{width:44px;height:44px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-weight:700}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stars{display:flex;gap:2px;direction:ltr;justify-content:flex-end}
.star{background:none;border:0;padding:4px;min-width:44px;min-height:44px;color:var(--line)}
.star.on{color:var(--accent)}
.empty{text-align:center;padding:24px 12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.order{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:right;width:100%}
.orow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--chip);white-space:nowrap}
.st.open,.st.awarded{color:var(--warn)}
.st.done{color:var(--good)}
.st.cancelled{color:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35;overflow-wrap:anywhere}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile.wide{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tile.wide .k{color:var(--bg);opacity:.75}
.tile.wide .v{font-size:28px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.toggle{width:58px;height:34px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-checked="true"]{background:var(--good)}
.toggle[aria-checked="true"]::after{transform:translateX(-24px)}
.prog{height:10px;border-radius:999px;background:var(--chip);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--good);border-radius:999px}
.freeban{background:var(--surface);border:2px dashed var(--good);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.freeban b{color:var(--good)}
.wallet{background:var(--ink);color:var(--bg);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.wallet::after{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:repeating-linear-gradient(135deg,var(--accent) 0 12px,transparent 12px 24px)}
.wallet .bal{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;direction:ltr;text-align:right}
.wallet .k{opacity:.8;font-size:13px}
.tx{display:flex;flex-direction:column}
.tx>div{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.tx>div:last-child{border-bottom:0}
.amtv{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr}
.plus{color:var(--good)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px;vertical-align:middle}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;color:var(--muted);font-size:12px}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);display:flex;align-items:flex-start;gap:6px}
.note svg{flex:none;margin-top:3px}
.payto{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px}
.payto b{font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.center{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.gbtn{background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:12px;min-height:50px;padding:0 20px;font-weight:700;display:inline-flex;align-items:center;gap:10px}
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:520px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--muted);position:relative}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;width:36px;height:4px;border-radius:0 0 4px 4px;background:var(--accent)}
.count{position:absolute;top:7px;margin-right:24px;background:var(--bad);color:#fff;border-radius:999px;font-size:10.5px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:30;max-width:calc(100% - 32px);text-align:center}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.icb{height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);display:grid;place-items:center}
.icb[aria-pressed="true"]{border:2px solid var(--accent);background:var(--chip)}
.cat-ic{width:44px;height:44px;border-radius:12px;background:var(--chip);display:grid;place-items:center;flex:none}
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto;padding-block:20px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet h2{display:flex;align-items:center;gap:8px}
.qrbox{background:#fff;color:#141a20;border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;align-self:center;border:2px solid var(--accent)}
.qrbox svg{width:min(260px,68vw);height:auto;display:block}
.invite{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--surface);border:2px dashed var(--accent);border-radius:16px;padding:14px;color:var(--ink)}
.invite .ic2{width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.themeb{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:none}
.themeb:hover{border-color:var(--accent)}
.search{display:flex;align-items:center;gap:8px;background:#fffdf5;border-radius:12px;padding:0 12px;min-height:50px;color:#141a20;margin-top:4px}
.search input{border:0;background:transparent;flex:1;min-width:0;min-height:48px;color:#141a20;font-size:16px}
.search input::placeholder{color:#6a6450}
.search input:focus{outline:none}
.search:focus-within{outline:3px solid var(--stripe);outline-offset:1px}
.memb{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:#141a20;color:#f2b705;border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.memb.dark{background:var(--ink);color:var(--accent)}
.installbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(500px,calc(100% - 24px));z-index:20;background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,.28)}
@media (max-width:380px){.cats{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const claiming={};
async function ensureNo(counter,field){
  if(!A.user||!A.profile||A.profile[field]||claiming[field])return;
  if(field==='techNo'&&!A.tech)return;
  claiming[field]=true;
  try{await db.runTransaction(async tx=>{const cref=db.doc('counters/'+counter),uref=db.doc('users/'+A.user.uid);
    const c=await tx.get(cref),u=await tx.get(uref);if(!c.exists||!u.exists||u.data()[field])return;
    const n=c.data().n+1;tx.update(cref,{n});tx.update(uref,{[field]:n});});}
  catch(e){console.warn('memberNo',e);}
  finally{setTimeout(()=>{claiming[field]=false;},5000);}
}

function sums(){
  const L=A.adm.ledger;const by=t=>L.filter(l=>l.type===t).reduce((a,l)=>a+l.amount,0);
  const approved=A.adm.topups.filter(t=>t.status==='approved');
  return {commission:by('commission'),premium:by('premium'),waived:by('waived'),bonus:by('bonus'),
    cash:approved.reduce((a,t)=>a+t.amount,0),
    debt:A.adm.techs.filter(t=>t.balance<0).reduce((a,t)=>a-t.balance,0),
    credit:A.adm.techs.filter(t=>t.balance>0).reduce((a,t)=>a+t.balance,0)};
}
function chart(){
  const N=14,end=dayN(),start=end-N+1;const rows=[];
  for(let d=start;d<=end;d++)rows.push({d,got:0,free:0});
  A.adm.ledger.forEach(l=>{const r=rows.find(r=>r.d===dayN(l.at));if(!r)return;if(l.type==='commission'||l.type==='premium')r.got+=l.amount;if(l.type==='waived')r.free+=l.amount;});
  const max=Math.max(1000,...rows.map(r=>r.got+r.free));const nice=Math.ceil(max/5000)*5000;
  const W=480,H=200,L=8,R=58,T=10,B=26,cw=(W-L-R)/N,ph=H-T-B;const y=v=>T+ph-(v/nice)*ph;let g='';
  [0,.5,1].forEach(f=>{const v=nice*f;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${W-R+6}" y="${y(v)+4}" font-size="11" fill="var(--muted)">${fmt(v)}</text>`;});
  rows.forEach((r,i)=>{const x=W-R-(i+1)*cw+cw*.18,bw=cw*.64;
    if(r.free)g+=`<rect x="${x}" y="${y(r.got+r.free)}" width="${bw}" height="${(r.free/nice)*ph}" rx="2" fill="var(--bar2)"/>`;
    if(r.got)g+=`<rect x="${x}" y="${y(r.got)}" width="${bw}" height="${(r.got/nice)*ph}" rx="2" fill="var(--accent)"/>`;
    if(i%2===0)g+=`<text x="${x+bw/2}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="middle">${r.d}</text>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="الدخل اليومي لآخر ١٤ يوم">${g}</svg>
  <div class="legend"><span><i style="background:var(--accent)"></i>عمولات واشتراكات</span><span><i style="background:var(--bar2)"></i>عمولات مجانية</span><span>الأرقام: اليوم من الإطلاق</span></div>`;
}

/* ================= share the app (QR) ================= */
const APP_URL='https://alialsaffarmosuluniversity.github.io/fazaa/';
const QR_LIB='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
let QR_SVG='';
function loadQR(){return new Promise((res,rej)=>{if(window.qrcode)return res();const sc=document.createElement('script');sc.src=QR_LIB;sc.onload=res;sc.onerror=rej;document.head.appendChild(sc);});}
function buildQR(){const q=qrcode(0,'H');q.addData(APP_URL);q.make();const N=q.getModuleCount(),B=2,S=N+2*B;let d='';
  for(let y=0;y<N;y++){let x=0;while(x<N){if(q.isDark(y,x)){let r=x;while(r<N&&q.isDark(y,r))r++;d+=`M${x+B} ${y+B}h${r-x}v1h-${r-x}z`;x=r;}else x++;}}
  const lg=N*0.24,lx=B+(N-lg)/2,f=n=>n.toFixed(2);
  return `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="كود QR لتطبيق فزعة" shape-rendering="crispEdges"><rect width="${S}" height="${S}" fill="#fff"/><path fill="#141a20" d="${d}"/><rect x="${f(lx-.8)}" y="${f(lx-.8)}" width="${f(lg+1.6)}" height="${f(lg+1.6)}" rx="2" fill="#fff"/><rect x="${f(lx)}" y="${f(lx)}" width="${f(lg)}" height="${f(lg)}" rx="1.6" fill="#f2b705"/><g transform="translate(${f(lx+lg*.18)},${f(lx+lg*.18)}) scale(${(lg*.64/24).toFixed(4)})"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z" fill="none" stroke="#141a20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" shape-rendering="geometricPrecision"/></g></svg>`;}
let shareMsg='';
async function openShare(){const el=$('#sharebox');if(!el)return;const tech=role==='tech';
  if(!QR_SVG){try{await loadQR();QR_SVG=buildQR();}catch(err){QR_SVG='<p class="small">ما انفتح الكود، أرسل الرابط بالواتساب.</p>';}}
  shareMsg=tech?'فني أو صاحب صنعة بالموصل؟ سجّل بتطبيق فزعة مجاناً، والزبائن يوصلون لعندك وإنت تحدد سعرك: ':'عندك عطل بالبيت؟ اكتب العطل بتطبيق فزعة، والفنيين يرسلولك أسعارهم وإنت تختار: ';
  el.innerHTML=`<div class="scrim" data-act="closeShare"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
    <div class="orow"><h2 id="shT">${ic('qr',20)} شارك فزعة</h2><button class="btn ghost sm" data-act="closeShare" aria-label="إغلاق">✕</button></div>
    <p class="small muted">${tech?'خلّي زملائك الفنيين يمسحون الكود ويسجلون مجاناً.':'خلّي أهلك وجيرانك يمسحون الكود ويلكون فنيهم بسهولة.'}</p>
    <div class="qrbox">${QR_SVG}<b>امسح الكود بكاميرة الموبايل</b></div>
    <div class="row2"><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(shareMsg+APP_URL)}" target="_blank" rel="noopener">أرسل بالواتساب</a><button class="btn sec2" data-act="copyApp">انسخ الرابط</button>${navigator.share?'<button class="btn dark" data-act="nativeShare">مشاركة</button>':''}</div>
  </div></div>`;
  el.hidden=false;}
function closeShare(){const el=$('#sharebox');if(el){el.hidden=true;el.innerHTML='';}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeShare();});

const themeNow=()=>document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');

/* ================= install (PWA) ================= */
let deferredPrompt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const UA=navigator.userAgent||'';
const isIOS=/iphone|ipad|ipod/i.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const inApp=/FBAN|FBAV|FB_IAB|Instagram|WhatsApp|Line\/|Snapchat|TikTok/i.test(UA);
let installHidden=false;try{installHidden=sessionStorage.getItem('fazaa-install-later')==='1';}catch(e){}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;renderInstall();});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;installHidden=true;renderInstall();toast('تثبّتت فزعة على جهازك');});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
function renderInstall(){
  const el=$('#install');if(!el)return;
  if(isStandalone()||installHidden||!A.user){el.hidden=true;el.innerHTML='';return;}
  let body,btn='';
  if(inApp){body='افتح الرابط بمتصفح الموبايل (كروم أو سفاري) حتى تكدر تثبّت فزعة.';btn=`<button class="btn pri sm" data-act="copyLink">انسخ الرابط</button>`;}
  else if(deferredPrompt){body='ثبّته على جهازك، وافتحه بلمسة وحدة وانت داخل دائماً.';btn=`<button class="btn pri sm" data-act="install">ثبّت التطبيق</button>`;}
  else if(isIOS){body='اضغط زر المشاركة أسفل سفاري، ثم اختار «إضافة إلى الشاشة الرئيسية».';}
  else{body='افتح قائمة المتصفح (النقاط الثلاث)، واختار «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».';}
  el.hidden=false;
  el.innerHTML=`<div class="installbar" role="dialog" aria-label="تثبيت فزعة"><div class="mark" aria-hidden="true">${ic('tool',22)}</div><div style="flex:1 1 200px;min-width:0"><b>ثبّت تطبيق فزعة</b><p class="small muted">${body}</p></div><div class="row2" style="flex:1 1 100%">${btn}<button class="btn ghost sm" data-act="installLater">لاحقاً</button></div></div>`;
}

/* ================= shell ================= */
const TABS={
  customer:[{id:'home',label:'الرئيسية',icon:'home'},{id:'orders',label:'طلباتي',icon:'list'},{id:'me',label:'خروج',icon:'out'}],
  tech:[{id:'tjobs',label:'الطلبات',icon:'tool'},{id:'twallet',label:'المحفظة',icon:'wallet'},{id:'tprofile',label:'حسابي',icon:'user'}],
  admin:[{id:'dash',label:'اللوحة',icon:'chart'},{id:'atopups',label:'الشحنات',icon:'money'},{id:'atechs',label:'الفنيون',icon:'users'},{id:'acats',label:'الاختصاصات',icon:'list'},{id:'asettings',label:'الإعدادات',icon:'gear'}]
};
const HOME={customer:'home',tech:'tjobs',admin:'dash'};
const PARENT={newReq:'home',track:'orders'};
function render(){
  renderInstall();paintBell();
  const view=$('#view'),nav=$('#nav'),roles=$('#roles'),dp=$('#dayp');
  if(!CONFIGURED){view.innerHTML=vNotConfigured();return;}
  if(A.user===null){roles.hidden=true;nav.hidden=true;dp.hidden=true;view.innerHTML=vLogin();return;}
  if(!A.user||A.profile===undefined||A.cfg===undefined){view.innerHTML=`<div class="center"><div class="spin" role="status" aria-label="جاري التحميل"></div></div>`;return;}
  if(A.profile===null){roles.hidden=true;nav.hidden=true;view.innerHTML=vProfileSetup();return;}
  if(!A.cfg){view.innerHTML=vNoCfg();nav.hidden=true;return;}
  if(role==='admin'&&!A.isAdmin)role='customer';
  dp.hidden=false;dp.textContent=isFree()?`مجاني · باقي ${daysLeft()} يوم`:'فزعة';dp.className='dayp'+(isFree()?' free':'');
  const R=[['customer','زبون','user'],['tech','فني','tool']];if(A.isAdmin)R.push(['admin','الإدارة','chart']);
  roles.hidden=false;roles.innerHTML=R.map(([r,l,i])=>`<button data-act="role" data-v="${r}" aria-pressed="${role===r}">${ic(i,16)} ${l}</button>`).join('');
  const all=TABS[role].map(t=>t.id).concat(Object.keys(PARENT).filter(k=>TABS[role].some(t=>t.id===PARENT[k])));
  if(!all.includes(V.name))V={name:HOME[role]};
  let html='';
  if(role==='tech'){
    if(A.tech===undefined)html=`<div class="center"><div class="spin"></div></div>`;
    else if(A.tech===null)html=vTechRegister();
    else html=({tjobs:vTJobs,twallet:vTWallet,tprofile:vTProfile}[V.name]||vTJobs)();
  }else if(role==='admin'){html=({dash:vDash,atopups:vATopups,atechs:vATechs,acats:vACats,asettings:vASettings}[V.name]||vDash)();}
  else html=({home:vHome,newReq:vNewReq,track:vTrack,orders:vOrders}[V.name]||vHome)();
  // keep typing intact: don't re-render a view while the user is editing a field in it
  const ae=document.activeElement;
  if(ae&&view.contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&render.lastView===V.name+(V.id||'')){render.pending=true;}
  else{view.innerHTML=html;render.pending=false;}
  render.lastView=V.name+(V.id||'');
  const cur=PARENT[V.name]||V.name;
  const badge={tjobs:A.tech?A.techAwarded.filter(o=>o.status==='awarded').length:0,atopups:A.adm.topups.filter(t=>t.status==='pending').length,orders:A.custOrders.filter(o=>o.status==='open'&&(A.offersByOrder[o.id]||[]).length).length};
  if(role==='tech'&&!(A.tech&&A.tech.status==='approved')){nav.hidden=true;}
  else{nav.hidden=false;$('#tabs').innerHTML=TABS[role].map(t=>`<button data-act="${t.id==='me'?'logout':'go'}" data-v="${t.id}" ${cur===t.id?'aria-current="page"':''}>${ic(t.icon,22)}${t.label}${badge[t.id]?`<span class="count">${badge[t.id]}</span>`:''}</button>`).join('');}
  if(role==='tech')watchOpen();
}
document.addEventListener('input',e=>{if(e.target.id==='svcq'){V.q=e.target.value;filterCats(V.q);}});
document.addEventListener('keydown',e=>{if(e.target.id==='svcq'&&e.key==='Enter'){const ids=filterCats(e.target.value);if(ids.length===1){e.preventDefault();go('newReq',{id:ids[0],form:null});}}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(render.pending&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render();},50));

/* ================= actions ================= */
const val=id=>(($('#'+id)||{}).value||'').trim();
const phoneOk=p=>/^07\d{9}$/.test(p.replace(/\s/g,''));
function locate(inputId){
  const inp=$('#'+inputId);
  if(!navigator.geolocation){toast('حدد الموقع يدوياً: الصق رابط من خرائط Google');return;}
  toast('جاري تحديد موقعك…');
  navigator.geolocation.getCurrentPosition(p=>{if(inp)inp.value=p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);toast('تم تحديد موقعك');},
    ()=>toast('ما قدرنا نحدد موقعك. فعّل الموقع بالموبايل أو الصق رابط من خرائط Google'),{timeout:10000,enableHighAccuracy:true});
}
async function confirmJob(o){
  const t=A.tech;const c=commFor(t,o.cat);const waived=isFree();
  if(!canWork(t))throw {message:'رصيدك وصل حد الدين، سدّد أولاً'};
  const b=db.batch();const uid=A.user.uid;
  b.update(db.doc('orders/'+o.id),{status:'accepted',commission:c,waived,acceptedAt:Date.now(),techPhone:A.techPhone||''});
  b.update(db.doc('techs/'+uid),{balance:t.balance-(waived?0:c),lastOrder:o.id});
  b.set(db.doc('ledger/c_'+o.id),{type:waived?'waived':'commission',amount:c,techUid:uid,orderId:o.id,at:Date.now()});
  await b.commit();
  toast(waived?`أكّدت الشغلة، والعمولة ${fmt(c)} مجانية هذا الشهر`:`أكّدت الشغلة، وانخصم ${fmt(c)} من رصيدك`);
}
async function approveTopup(tp){
  const tech=A.adm.techs.find(x=>x.id===tp.techUid);if(!tech)throw {message:'الفني غير موجود'};
  const bonus=(tech.topups||0)===0?Math.floor(tp.amount*C().bonusPct/100):0;
  const inc=firebase.firestore.FieldValue.increment;const b=db.batch();const now=Date.now();
  b.update(db.doc('topups/'+tp.id),{status:'approved',decidedAt:now,bonus});
  b.update(db.doc('techs/'+tp.techUid),{balance:inc(tp.amount+bonus),topups:inc(1)});
  b.set(db.collection('ledger').doc(),{type:'topup',amount:tp.amount,techUid:tp.techUid,ref:tp.ref,method:tp.method,at:now});
  if(bonus)b.set(db.collection('ledger').doc(),{type:'bonus',amount:bonus,techUid:tp.techUid,at:now});
  await b.commit();toast('انضاف '+fmt(tp.amount+bonus)+' لرصيد '+tp.techName);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  const order=()=>A.custOrders.find(x=>x.id===id)||A.techAwarded.find(x=>x.id===id);
  switch(a){
    case 'login':run(login);return;
    case 'shareApp':openShare();return;
    case 'closeShare':if(e.target===b||b.tagName==='BUTTON')closeShare();return;
    case 'copyApp':try{navigator.clipboard.writeText(APP_URL).then(()=>toast('انسخ رابط فزعة'),()=>toast(APP_URL));}catch(err){toast(APP_URL);}return;
    case 'nativeShare':try{navigator.share({title:'فزعة',text:shareMsg,url:APP_URL}).catch(()=>{});}catch(err){}return;
    case 'pickIcon':V.icon=v;document.querySelectorAll('.icb').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===v)));return;
    case 'catEdit':V.ced=id;V.icon=null;render.pending=false;render();window.scrollTo(0,0);return;
    case 'catCancel':V.ced=null;V.icon=null;render.pending=false;render();return;
    case 'catToggle':run(async()=>{const list=CATS.map(c=>c.id===id?Object.assign({},c,{active:c.active===false}):c);await db.doc('config/app').update({cats:list});toast('انحفظ');});return;
    case 'install':if(deferredPrompt){const p=deferredPrompt;p.prompt();p.userChoice.then(r=>{deferredPrompt=null;if(r.outcome!=='accepted')toast('تكدر تثبّته بعدين من قائمة المتصفح');renderInstall();});}return;
    case 'installLater':installHidden=true;try{sessionStorage.setItem('fazaa-install-later','1');}catch(err){}renderInstall();return;
    case 'copyLink':try{navigator.clipboard.writeText(location.origin+location.pathname).then(()=>toast('انسخ الرابط، الصقه بكروم أو سفاري'),()=>toast(location.href));}catch(err){toast(location.href);}return;
    case 'logout':run(async()=>{await auth.signOut();});return;
    case 'role':role=v;try{localStorage.setItem('fazaa-role',v);}catch(err){}V={name:HOME[v]};render();window.scrollTo(0,0);return;
    case 'go':go(v);return;
    case 'newReq':go('newReq',{id,form:null});return;
    case 'track':go('track',{id});return;
    case 'when':{V.form=readReq();V.form.when=v;render.pending=false;$('#view').innerHTML=vNewReq();return;}
    case 'locate':locate(v);return;
    case 'copy':try{navigator.clipboard.writeText(v).then(()=>toast('انسخ'),()=>toast(v));}catch(err){toast(v);}return;
    case 'initCfg':run(async()=>{await db.doc('config/app').set(DEFAULT_CFG());toast('انحفظت الإعدادات الأولى');});return;
    case 'award':run(async()=>{const o=order();const f=(A.offersByOrder[id]||[]).find(x=>x.techUid===v);
      await db.doc('orders/'+id).update({status:'awarded',techUid:v,techName:f.techName,price:f.price,awardedAt:Date.now()});toast('أرسلنا اختيارك لـ '+f.techName);});return;
    case 'unaward':run(async()=>{await db.doc('orders/'+id).update({status:'open',techUid:null,techName:null,price:null,awardedAt:null});toast('رجع طلبك للعروض');});return;
    case 'cancel':run(async()=>{await db.doc('orders/'+id).update({status:'cancelled'});toast('انلغى الطلب');});return;
    case 'share':run(async()=>{const on=v==='1';const b2=db.batch();
      if(on){const m=val('s_map');if(m)b2.set(db.doc('orders/'+id+'/private/contact'),{map:m},{merge:true});}
      b2.update(db.doc('orders/'+id),{share:on});await b2.commit();toast(on?'وصل رقمك وموقعك للفني':'أوقفت المشاركة');});return;
    case 'rate':run(async()=>{const o=order();const b2=db.batch();
      b2.set(db.doc('ratings/'+id),{techUid:o.techUid,customerUid:A.user.uid,stars:+v,at:Date.now()});b2.update(db.doc('orders/'+id),{rated:+v});await b2.commit();toast('شكراً على تقييمك');});return;
    case 'avail':run(async()=>{await db.doc('techs/'+A.user.uid).update({available:A.tech.available===false});});return;
    case 'confirm':run(()=>confirmJob(order()));return;
    case 'techDecline':run(async()=>{const b2=db.batch();b2.update(db.doc('orders/'+id),{status:'open',techUid:null,techName:null,price:null,awardedAt:null});
      b2.delete(db.doc('orders/'+id+'/offers/'+A.user.uid));await b2.commit();toast('اعتذرت، والطلب رجع للزبون');});return;
    case 'step':run(async()=>{const o=order();const next=FLOW[FLOW.indexOf(o.status)+1];const upd={status:next};if(next==='done')upd.doneAt=Date.now();
      await db.doc('orders/'+id).update(upd);toast(STAT[next]);});return;
    case 'editOffer':V.edit=id;render.pending=false;render();return;
    case 'withdraw':run(async()=>{await db.doc('orders/'+id+'/offers/'+A.user.uid).delete();toast('سحبت عرضك');});return;
    case 'amt':V.amt=+v;render.pending=false;render();return;
    case 'meth':V.meth=v;render.pending=false;render();return;
    case 'premium':run(async()=>{const t=A.tech,s=C();const base=Math.max(Date.now(),t.premiumUntil||0);const b2=db.batch();
      b2.update(db.doc('techs/'+A.user.uid),{balance:t.balance-s.premiumPrice,premiumUntil:base+30*DAY});
      b2.set(db.collection('ledger').doc(),{type:'premium',amount:s.premiumPrice,techUid:A.user.uid,at:Date.now()});await b2.commit();toast('صرت فني مميز لمدة شهر');});return;
    case 'notif':if(!canNotify()){toast('هذا المتصفح ما يدعم التنبيهات. ثبّت التطبيق أو افتحه بكروم');return;}
      if(Notification.permission==='denied'){toast('التنبيهات مقفلة. فعّلها من إعدادات الموقع بالمتصفح (رمز القفل جنب الرابط)');return;}
      if(Notification.permission==='granted'){notify('🔔 التنبيهات شغّالة','راح يوصلك إشعار مع كل تحديث',true);return;}
      Notification.requestPermission().then(pp=>{paintBell();render.pending=false;render();if(pp==='granted')notify('🔔 تفعّلت التنبيهات','راح يوصلك إشعار مع كل تحديث',true);else toast('ما تفعّلت التنبيهات');});return;
    case 'approveTop':run(()=>approveTopup(A.adm.topups.find(x=>x.id===id)));return;
    case 'rejectTop':run(async()=>{await db.doc('topups/'+id).update({status:'rejected',decidedAt:Date.now()});toast('انرفض طلب الشحن');});return;
    case 'techStatus':run(async()=>{await db.doc('techs/'+id).update({status:v});toast(v==='approved'?'تفعّل الفني':'توقف الفني');});return;
    case 'techPhone':run(async()=>{const s=await db.doc('techs/'+id+'/private/info').get();const el=$('#ph_'+id);if(el)el.textContent=s.exists?s.data().phone:'ما في رقم';});return;
  }
});
function readReq(){const sh=$('#r_share');return {problem:val('r_problem'),area:val('r_area'),addr:val('r_addr'),phone:val('r_phone'),map:val('r_map'),share:sh?sh.checked:true,when:(V.form||{}).when||'الآن'};}

document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='profileForm')return run(async()=>{const name=val('p_name'),phone=val('p_phone'),area=val('p_area');
    if(!name||!phoneOk(phone)){const er=$('#pErr');er.textContent='اكتب اسمك ورقم موبايل يبدأ بـ 07 (١١ رقم)';er.hidden=false;return;}
    await db.doc('users/'+A.user.uid).set({name,phone,area,email:A.user.email||'',createdAt:Date.now()});});
  if(f.id==='reqForm')return run(async()=>{const r=readReq();const er=$('#rErr');
    const miss=[!r.problem&&'شنو العطل',!r.addr&&'العنوان',!phoneOk(r.phone)&&'رقم موبايل صحيح'].filter(Boolean);
    if(miss.length){er.textContent='اكمل: '+miss.join('، ');er.hidden=false;return;}
    const ref=db.collection('orders').doc();const b=db.batch();
    b.set(ref,{customerUid:A.user.uid,customerName:(A.profile||{}).name||'',cat:V.id,area:r.area,problem:r.problem,when:r.when,share:r.share,createdAt:Date.now(),status:'open',techUid:null});
    b.set(ref.collection('private').doc('contact'),{phone:r.phone,addr:r.addr,map:r.map});
    await b.commit();toast('انتشر طلبك. العروض توصلك هنا');go('track',{id:ref.id});});
  if(f.id==='techForm')return run(async()=>{const name=val('t_name'),phone=val('t_phone');const er=$('#tErr');
    if(!name||!phoneOk(phone)){er.textContent='اكتب اسمك ورقم موبايل صحيح';er.hidden=false;return;}
    const uid=A.user.uid;const b=db.batch();
    b.set(db.doc('techs/'+uid),{name,cat:val('t_cat'),area:val('t_area'),bio:val('t_bio'),status:'pending',balance:0,topups:0,premiumUntil:0,available:true,createdAt:Date.now()});
    b.set(db.doc('techs/'+uid+'/private/info'),{phone});await b.commit();A.techPhone=phone;toast('وصل طلب تسجيلك');});
  if(f.dataset.offer)return run(async()=>{const oid=f.dataset.offer;const price=Math.round(+val('op_'+oid));const eta=Math.round(+val('oe_'+oid));
    if(!(price>=1000)){toast('اكتب سعر صحيح (١٠٠٠ دينار أو أكثر)');return;}
    if(!(eta>=5&&eta<=1440)){toast('وقت الوصول بين ٥ و ١٤٤٠ دقيقة');return;}
    await db.doc('orders/'+oid+'/offers/'+A.user.uid).set({techUid:A.user.uid,techName:A.tech.name,price,eta,note:val('on_'+oid),at:Date.now()});
    V.edit=null;render.pending=false;toast('وصل عرضك للزبون');render();});
  if(f.id==='topForm')return run(async()=>{const ref=val('tp_ref');if(ref.length<3){toast('اكتب رقم العملية');return;}
    await db.collection('topups').add({techUid:A.user.uid,techName:A.tech.name,amount:V.amt||25000,method:V.meth||'zain',ref,status:'pending',createdAt:Date.now()});
    toast('وصل طلبك، يضاف الرصيد بعد التأكد');render.pending=false;render();});
  if(f.id==='tEdit')return run(async()=>{await db.doc('techs/'+A.user.uid).update({name:val('te_name'),area:val('te_area'),bio:val('te_bio')});toast('انحفظ');});
  if(f.id==='catForm')return run(async()=>{const name=val('k_name');if(!name){toast('اكتب اسم الاختصاص');return;}
    const comm=Math.max(0,Math.round(+val('k_comm')||0));const kw=val('k_kw');const icon=V.icon||(V.ced?catIcon(CATS.find(c=>c.id===V.ced)):'tool');
    let list,id;
    if(V.ced){id=V.ced;list=CATS.map(c=>c.id===id?Object.assign({},c,{name,kw,icon}):c);}
    else{if(CATS.some(c=>c.name===name)){toast('هذا الاختصاص موجود');return;}id='c'+Date.now().toString(36);list=CATS.concat([{id,name,kw,icon,active:true}]);}
    await db.doc('config/app').update({cats:list,['comm.'+id]:comm});
    V.ced=null;V.icon=null;render.pending=false;toast('انحفظ الاختصاص');render();});
  if(f.id==='cfgForm')return run(async()=>{const n=(id)=>Math.max(0,Math.round(+val(id)||0));const d=val('c_launch').split('-').map(Number);
    const comm={};CATS.forEach(c=>comm[c.id]=n('c_c_'+c.id));
    await db.doc('config/app').set({launch:new Date(d[0],d[1]-1,d[2]).getTime(),freeDays:n('c_free'),comm,creditLimit:n('c_credit'),bonusPct:Math.min(100,n('c_bonus')),
      premiumPrice:n('c_prem'),premiumDisc:Math.min(100,n('c_disc')),warrantyDays:n('c_war'),payTo:{name:val('c_pname'),zain:val('c_zain'),fib:val('c_fib')}});
    render.pending=false;toast('انحفظت الإعدادات');});
});

/* ================= boot ================= */
if(CONFIGURED&&!auth){
  $('#view').innerHTML=`<div class="card alert"><h2>ما انفتحت مكتبات Firebase</h2><p class="small">افتح التطبيق من رابطه على كيت هب، وتأكد إن الانترنت شغّال. معاينة الملف داخل المحادثة ما تكدر تحمّل Firebase.</p></div>`;
}else if(CONFIGURED){
  auth.getRedirectResult().catch(e=>toast(errMsg(e)));
  auth.onAuthStateChanged(u=>{
    unsubAll();firstLoad={};
    Object.assign(A,{user:u||null,isAdmin:!!(u&&ADMIN_EMAILS.includes((u.email||"").toLowerCase())&&u.emailVerified),profile:undefined,tech:undefined,cfg:undefined,
      approvedTechs:[],custOrders:[],techAwarded:[],openOrders:[],myOffers:{},offersByOrder:{},contacts:{},topups:[],ledger:[],adm:{orders:[],topups:[],techs:[],ledger:[]}});
    if(u)startSession(u);
    render();
  });
  setInterval(()=>{if(!render.pending)render();},60000);
}else render();
})();
</script>
